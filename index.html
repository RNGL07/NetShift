<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14171A" />
    <meta
      name="description"
      content="NetShift — pay, overtime, and paycheck planning for hourly and shift workers. Estimates and educational tools, not financial advice."
    />
    <!-- Financial data should never be indexed or previewed by a crawler. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>NetShift</title>
    <style>
      /* Painted before the bundle loads, so there is no white flash on a dark
         app opened from a phone home screen. */
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #14171a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #ece9e2; font-family: sans-serif; padding: 24px">
        NetShift needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
